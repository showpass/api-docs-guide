          example: bfe3a0c2-4c10-4c27-b1f6-ffb9bdc20ad1
    HoldLinkEmailRequest:
      type: object
      properties:
        message_to_customer:
          type: string
          description: Optional message saved on the basket.
        language:
          type: string
          description: Supported Showpass language code.
          example: en
    HoldBasketEditItemRequest:
      type: object
      required:
        - item_type
        - type
        - quantity
      properties:
        item_type:
          type: string
          description: This example creates ticket inventory.
          enum:
            - ticket
        type:
          type: integer
          description: Ticket type ID belonging to an event available to the selling venue.
          minimum: 1
        quantity:
          type: integer
          description: Number of tickets to reserve, subject to inventory and purchase limits.
          minimum: 1
        id:
          type: integer
          description: >-
            Existing item group ID from the retrieved basket. Preserve this ID for groups you keep; omit it
            only for a new group.
          minimum: 1
    HoldBasketEditRequest:
      type: object
      required:
        - item_groups
      properties:
        item_groups:
          type: array
          items:
            $ref: '#/components/schemas/HoldBasketEditItemRequest'
          description: >-
            Complete desired item group list. Keep existing group IDs. Groups omitted from this list are
            removed; this is not a list of only the changed groups.
        info_first_name:
          type: string
          description: Customer first name.
        info_last_name:
          type: string
          description: Customer last name.
        info_email:
          type: string
          description: Customer information email.
          format: email
        email:
          type: string
          description: Basket customer email; required before sending a hold link email.
          format: email
        name_on_ticket:
          type: string
          description: Customer display name; alternatively send info_first_name and info_last_name.
        phone_number:
          type: string
        purchase_note:
          type: string
          description: Note associated with the basket.
        language:
          type: string
          description: Supported Showpass language code.
          example: en
        discount_codes:
          type: array
          items:
            type: string
            description: An existing discount code.
        checkout_idempotency_key:
          type: string
          description: >-
            For regular basket PUT, echo the latest key from GET and keep the new key from the response. Stale
            keys are rejected when basket idempotency checks are enabled. Missing keys are currently
            tolerated; clients should still send one. This version check is not enforced by the held-basket
            view.
        payment_type:
          type: integer
          description: >-
            Current numeric payment type returned by GET. Preserve this value when editing.
        sold_by:
          type: integer
          description: Current seller ID. Preserve when editing another seller's hold with manage-all-holds access.
          minimum: 1
      description: >-
        General admission ticket basket edit shape. Read the current basket first and preserve its customer,
        seller, discount, and allocation settings. Send the complete desired item_groups list and current
        payment_type; the shared basket validation expects them. Assigned seating
        and other inventory types require their corresponding allocation fields.
    HoldSplitItemRequest:
      type: object
      required:
        - item_group_id
        - quantity
      properties:
        item_group_id:
          type: integer
          description: Item group ID belonging to the original held basket, not a ticket type ID.
          minimum: 1
        quantity:
          type: integer
          description: Positive quantity to move, no greater than the quantity currently held in this group.
          minimum: 1
    HoldSplitRequest:
      type: object
      required:
        - ticket_item_groups_to_split
        - name_on_ticket
      properties:
        ticket_item_groups_to_split:
          type: array
          items:
            $ref: '#/components/schemas/HoldSplitItemRequest'
          minItems: 1
        name_on_ticket:
          type: string
          description: Required customer name. It is applied to the new basket when a non-null email is provided.
          maxLength: 128
        email:
          type: string
          description: >-
            Provide the new recipient email to replace the copied customer details. If omitted or null,
            customer details are inherited from the original basket.
          nullable: true
          maxLength: 128
        phone_number:
          type: string
          description: Optional replacement phone number, applied with a non-null email.
          nullable: true
          maxLength: 128
    HoldSplitResult:
      type: object
      required:
        - id
      properties:
        id:
          type: integer
          description: New held basket ID. Retrieve this basket to obtain its checkout link.
          minimum: 1
    HoldBulkEmailRequest:
      type: object
      required:
        - basket_ids
      properties:
        basket_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
          description: >-
            IDs of baskets belonging to this venue, each with a saved customer email and an available hold
            link.
        message_to_customer:
          type: string
          description: Optional message saved on the basket.
        language:
          type: string
          description: Supported Showpass language code.
          example: en
    DynamicHoldSettingsUpdate:
