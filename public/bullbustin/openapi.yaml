    WebhookEnvelope:
      type: object
      required:
        - id
        - event_type
        - webhook_event_uuid
        - data
      properties:
        id:
          type: string
          description: Root identifier signed with HMAC SHA1; invoice examples use the transaction ID.
        event_type:
          type: string
          enum:
            - invoice.purchase
            - invoice.refund
            - invoice.void
            - invoice.transfer
            - invoice.transferred
            - webhook.test
        webhook_event_uuid:
          type: string
          description: Deduplication key for this webhook event.
          format: uuid
        data:
          anyOf:
            - $ref: '#/components/schemas/WebhookInvoice'
            - type: object
              additionalProperties: true
              description: Test event data or another configured payload structure.
      description: >-
        Outbound POST payload delivered to the configured Bullbustin HTTPS receiver. X-SHOWPASS-SIGNATURE is
        the hex HMAC SHA1 of String(id). Invoice fields vary with transaction and event type; additional
        fields may be present.
      example:
        id: f1-1068-4af6-be8f-1222417da0f2
        data:
          currency: CAD
          discounts: '0.00'
          net_sales: '5.84'
          total_tax: '0.25'
          invoice_type: sale
          payment_type: credit
          service_fees: '0.59'
          ticket_items:
            - id: 41349751
              event_id: '474708'
              event_name: Bullbustin example event
              product_id: null
              product_name: null
              event_ends_on: '2026-12-03T04:00:00Z'
              ticket_status: issued
              barcode_string: EXAMPLE-BARCODE
              name_on_ticket: null
              ticket_type_id: '1657978'
              email_on_ticket: null
              event_starts_on: '2026-12-02T04:00:00Z'
              ticket_item_type: ticket
              ticket_type_name: A test ticket
              ticket_status_code: '2'
              created_by_transfer: false
              last_name_on_ticket: null
              first_name_on_ticket: null
              product_attribute_id: null
              phone_number_on_ticket: null
              product_attribute_name: null
          customer_name: Example Customer
          gross_revenue: '5.20'
          invoice_items:
            - id: 21110231
              event_id: '474708'
              quantity: 1
              discounts: '0.00'
              net_sales: '5.84'
              total_tax: '0.25'
              event_name: Bullbustin example event
              product_id: null
              product_name: null
              service_fees: '0.59'
              gross_revenue: '5.20'
              organizer_fees: '0.00'
              ticket_type_id: '1657978'
              ticket_type_name: A test ticket
              event_facebook_id: null
              invoice_item_type: ticket
              product_attribute_id: null
              account_credit_applied: '0.00'
              product_attribute_name: null
              ticket_type_external_id: null
          customer_email: customer@example.com
          organizer_fees: '0.00'
          transaction_id: f1-1068-4af6-be8f-1222417da0f2
          invoice_type_id: '101'
          other_payment_type: null
          subscribe_to_venue: false
          account_credit_type: null
          customer_phone_number: null
          account_credit_applied: '0.00'
          showpass_organization_id: '5796'
        event_type: invoice.purchase
        webhook_event_uuid: 09117c09-e1f8-4913-b2f5-52cc161cf5f7
    HoldBasketItemRequest:
      type: object
      required:
        - item_type
        - type
        - quantity
      properties:
        item_type:
          type: string
          description: This example creates ticket inventory.
          enum:
            - ticket
        type:
          type: integer
          description: Ticket type ID belonging to an event available to the selling venue.
          minimum: 1
        quantity:
          type: integer
          description: Number of tickets to reserve, subject to inventory and purchase limits.
          minimum: 1
    HoldBasketCreateRequest:
      type: object
      required:
        - item_groups
      properties:
        item_groups:
          type: array
          items:
            $ref: '#/components/schemas/HoldBasketItemRequest'
          minItems: 1
        info_first_name:
          type: string
          description: Customer first name.
        info_last_name:
          type: string
          description: Customer last name.
        info_email:
          type: string
          description: Customer information email.
          format: email
        email:
          type: string
          description: Basket customer email; required before sending a hold link email.
          format: email
        name_on_ticket:
          type: string
          description: Customer display name; alternatively send info_first_name and info_last_name.
        phone_number:
          type: string
        purchase_note:
          type: string
          description: Note associated with the basket.
        language:
          type: string
          description: Supported Showpass language code.
          example: en
        discount_codes:
          type: array
          items:
            type: string
            description: An existing discount code.
      description: >-
        Focused ticket basket shape for general admission holds. Inventory, customer information, and
        event-specific requirements are validated by the server. Assigned seating and other inventory types
        need their corresponding allocation fields and permissions.
    PlaceBasketOnHoldRequest:
      type: object
      properties:
        hold_type:
          type: string
          description: >-
            basic_hold creates a standard customer hold. dynamic_hold uses the shared allocation workflow and
            its eligibility checks.
          enum:
            - basic_hold
            - dynamic_hold
          default: basic_hold
        hold_expiry_date:
          type: string
          description: Optional future expiry. Requires hold expiry to be enabled. Null means no scheduled hold expiry.
          format: date-time
          nullable: true
        is_comp_hold_link:
          type: boolean
          default: false
          description: >-
            Requires complimentary hold links to be enabled, complimentary ticket permission, and an eligible
            basic hold. Not supported for dynamic or group holds or with discounts.
        customer_group:
          type: object
          additionalProperties: true
          nullable: true
          description: Optional group-sale configuration. Omit for an ordinary customer hold.
    HoldBasketItem:
      type: object
      properties:
        id:
          type: integer
        item_type:
          type: string
        type:
          type: integer
          nullable: true
        event:
          type: integer
          nullable: true
        quantity:
          type: integer
        status:
          type: integer
        price:
          type: string
          description: Decimal value.
    HoldLinkDetails:
      type: object
      properties:
        id:
          type: integer
        hold_type:
          type: string
        is_comp_hold_link:
          type: boolean
        description:
