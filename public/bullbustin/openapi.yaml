          nullable: true
        created:
          type: string
          format: date-time
          nullable: true
        updated:
          type: string
          format: date-time
          nullable: true
        items_sold:
          type: integer
    HoldBasket:
      type: object
      properties:
        id:
          type: integer
        uuid:
          type: string
          format: uuid
        status:
          type: integer
          description: 1 pending; 10 on hold. Other numeric statuses can occur after checkout or release.
        sold_by_venue:
          type: integer
        sold_by:
          type: integer
          nullable: true
        email:
          type: string
          nullable: true
        name_on_ticket:
          type: string
          nullable: true
        item_groups:
          type: array
          items:
            $ref: '#/components/schemas/HoldBasketItem'
        currency:
          type: string
        total_price:
          type: string
          description: Decimal amount.
        hold_url:
          type: string
          description: Legacy hold checkout URL; may be null when the URL is under on_hold_detail.
          format: uri
          nullable: true
        hold_link_slug:
          type: string
          nullable: true
        on_hold_detail:
          allOf:
            - $ref: '#/components/schemas/HoldLinkDetails'
          description: Hold metadata, when present. It can be null before the hold is created.
          nullable: true
          type: object
        hold_expiry_date:
          type: string
          description: Scheduled hold expiry, if configured.
          format: date-time
          nullable: true
        expiry_date:
          type: string
          description: Basket expiry; separate from scheduled hold expiry.
          format: date-time
          nullable: true
        checkout_idempotency_key:
          type: string
          description: Version token returned for subsequent basket edits.
        post_purchase_completed:
          type: boolean
    PaginatedHeldBaskets:
      type: object
      properties:
