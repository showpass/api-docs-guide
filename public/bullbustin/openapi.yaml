openapi: 3.0.3
info:
  title: Bullbustin + Showpass account integration API
  version: 1.3.0
  contact:
    name: Showpass integrations team
  description: >-
    Integration reference for Bullbustin: public discovery, organization orders and tickets, patron accounts,
    ticket scanning, tracking links, discounts, access passwords, held baskets and hold links, and webhooks.


    ### Authentication by API group


    * Public catalog and discovery: no API token. Browser origins must be allowlisted in Showpass.

    * Private organization, ticket scanning, tracking links, discounts, and access passwords: send
    `Authorization: Token <organization-api-key>` for the venue in the URL.

    * Patron account operations: send `Authorization: JWT <access-token>` after patron authentication.

    The selected server is the demo environment. Use credentials and IDs for that environment. Optional
    capabilities require the corresponding Showpass venue configuration.


    ### Webhooks


    Showpass sends HTTP POST notifications to the HTTPS receiver configured by Bullbustin. Configure it in
    **Organization Settings > Webhooks > Add Endpoint**, select the events, save, and retrieve the endpoint
    Secret Key. Use **Send Test** to verify delivery. The endpoint can be edited, paused, resumed, or deleted
    in the same dashboard.


    | Event | Meaning |

    | --- | --- |

    | `invoice.purchase` | A successful purchase. |

    | `invoice.refund` | A refund. |

    | `invoice.void` | A voided transaction. |

    | `invoice.transfer` | New invoice and ticket records for the transfer recipient. |

    | `invoice.transferred` | Updated invoice and ticket records for the original purchaser. |

    | `webhook.test` | A dashboard test delivery. |


    #### Verify the webhook signature


    Read `X-SHOWPASS-SIGNATURE` and compare it in constant time to the hexadecimal HMAC SHA1 of the **root
    payload `id`, converted to a UTF-8 string**, using the webhook endpoint Secret Key. The signed input is
    the root ID; the signature does not cover the full JSON body, `data`, or `webhook_event_uuid`.


    ```python

    import hashlib

    import hmac


    def verify_showpass_webhook(payload, received_signature, secret):
        if not isinstance(payload, dict) or payload.get("id") is None:
            return False
        if not isinstance(received_signature, str):
            return False
        if len(received_signature) != 40 or any(
            ch not in "0123456789abcdef" for ch in received_signature
        ):
            return False
        expected = hmac.new(
            secret.encode("utf-8"),
            str(payload["id"]).encode("utf-8"),
            hashlib.sha1,
        ).hexdigest()
        return hmac.compare_digest(expected, received_signature)
    ```


    #### Delivery, deduplication, and recovery


    After signature verification, durably persist the event before acknowledging it with a 2xx response.
    Deduplicate by `webhook_event_uuid`, not the transaction ID: different events can concern the same order.
    A repeated event should be acknowledged without repeating its business effects. Process longer work
    asynchronously; the sender has a 10 second timeout.


    Inspect **Organization Settings > Webhooks > Events** for payloads and attempts, and the **Logs** views
    for HTTP responses and failures. Resend failed events after correcting receiver issues. Reconcile any
    delivery gaps with the private organization invoice and ticket endpoints. Secret regeneration invalidates
    the previous key; coordinate updating the receiver. Resends use the current endpoint secret.


    #### Payload


    The envelope contains `id`, `event_type`, `webhook_event_uuid`, and `data`. Invoice notifications include
    transaction and organization identifiers, customer and payment details, totals, `ticket_items`, and
    `invoice_items`. See the **WebhookEnvelope**, **WebhookInvoice**, **WebhookTicketItem**, and
    **WebhookInvoiceItem** schemas below. Test deliveries can have a different `data` shape.


    For the complete field table and dashboard instructions, see [invoice
    payloads](https://dev.showpass.com/webhooks/webhooks-payload-invoice-object),
    [setup](https://dev.showpass.com/webhooks/webhooks-setup-and-management), and [delivery
    logs](https://dev.showpass.com/webhooks/webhooks-logging-and-troubleshooting).
servers:
  - url: https://demo.showpass.com
    description: Demo
externalDocs:
  description: Showpass embedded purchase SDK documentation
  url: https://dev.showpass.com/sdk/02-ticket-purchase-widget
tags:
  - name: Authentication
  - name: Public catalog
  - name: Private organization API
  - name: Historical account
  - name: Memberships
  - name: Order actions
  - name: Ticket scanning
    description: >-
      Verify a ticket code, then create a pickup, return, or void scan history. Returning a scan restores
      entry eligibility; it does not refund the order.
  - name: Tracking links
    description: >-
      Manage campaign, employee, affiliate, venue, and quick purchase links. Only quick purchase links can be
      updated; links with completed purchases cannot be deleted.
  - name: Discounts
    description: >-
      Create checkout discount codes and eligible auto discounts. Codes are unique per venue,
      case-insensitively. Used discounts lock their code, amount, and percentage. DELETE soft-deletes the
      discount.
  - name: Access passwords
    description: >-
      Manage event and ticket type access codes. Set an active start time for immediate use. Purchase limits
      count ticket quantity. Matching is case-insensitive; password_use_count is an event attachment count,
      not a redemption count.
  - name: Held baskets and hold links
    description: >-
      Create hold links, edit baskets and holds, split held inventory, send individual or bulk emails, and
      manage dynamic hold settings, expiry, or release. Expand Create a basket for a hold for the creation
      workflow. Access is scoped to the venue and caller permissions.
x-organization-integration:
  description: >-
    Use the private venue API for an organization-owned Bullbustin integration. The organization API token is
    sent as `Authorization: Token <organization-api-key>` and is scoped to the venue in the URL. This flow
    does not require a patron JWT or patron login.
  base_url: https://demo.showpass.com
  event_list: /api/venue/{venue_id}/events/
  invoice_list: /api/venue/{venue_id}/financials/invoices/
x-embedded-purchase:
  description: Use the hosted Showpass SDK/widget for ticket selection, assigned seating, payment, and issuance.
  sdk_example: showpass.tickets.eventPurchaseWidget("bullbustin-event-slug");
  widget_urls:
    - /widget/tickets/events/purchase/{event-slug}/
    - /widget/tickets/events/calendar/{venue-id}/
    - /widget/calendar/venue/{venue-id}/
    - /widget/tickets/products/purchase/{product-id}/
    - /widget/tickets/memberships/{membership-id}/
x-webhook-integration:
  description: >-
    Bullbustin supplies an HTTPS receiver and configures purchase, refund, void, transfer, and transferred
    notifications in Showpass. See the visible Webhooks guide and WebhookEnvelope schema.
  requirements:
    - >-
      Verify X-SHOWPASS-SIGNATURE as a hexadecimal HMAC SHA1 of the root payload id converted to a UTF-8
      string, using the endpoint Secret Key.
    - Persist and deduplicate each delivery before acknowledging it.
    - Reconcile with private organization order and ticket reads after downtime.
    - Do not use webhook delivery as a replacement for private historical order reads.
x-recommended-flow:
  - Use the private organization event endpoint to find the Showpass event ID.
  - Open the hosted purchase widget through the Showpass SDK when Bullbustin needs to sell tickets.
  - Read organization orders with the private invoice endpoint, filtered by email, user ID, or event ID.
  - Follow `next` on every paginated response.
  - Subscribe to venue-configured notifications and reconcile after any delivery gap.
security: []
paths:
  /api/auth/login/:
    post:
      tags:
        - Authentication
      operationId: login
      summary: Authenticate a Showpass patron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated patron and tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/auth/registration/:
    post:
      tags:
        - Authentication
      operationId: register
      summary: Register a Showpass patron account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationRequest'
      responses:
        '200':
          description: Registered patron and tokens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
  /api/auth/jwt/refresh/:
    post:
      tags:
        - Authentication
      operationId: refreshJwt
      summary: Refresh an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Refreshed access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwtResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/profile/:
    get:
      tags:
        - Authentication
      operationId: getProfile
      summary: Get the authenticated patron profile
      security:
        - JwtAuth: []
      responses:
        '200':
          description: Patron profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/public/events/:
    get:
      tags:
        - Public catalog
      operationId: listPublicEvents
      summary: List public events
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: q
          in: query
          schema:
            type: string
        - name: starts_on__gte
          in: query
          schema:
            type: string
            format: date-time
        - name: ends_on__lte
          in: query
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Public event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEvents'
  /api/public/events/{slugOrId}/:
    get:
      tags:
        - Public catalog
      operationId: getPublicEvent
      summary: Get one public event
      parameters:
        - $ref: '#/components/parameters/SlugOrId'
      responses:
        '200':
          description: Public event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venue/{venueId}/events/:
    get:
      tags:
        - Private organization API
      operationId: listOrganizationEvents
      summary: List events for the organization
      description: >-
        Lists events owned by the organization identified by `venueId`. Use the numeric event `id` as
        Bullbustin's primary external event key; `slug` is an additional URL-friendly reference. The
        organization token cannot access another organization's events.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/VenuePageSize'
        - name: id
          in: query
          description: Return one event by numeric Showpass event ID.
          schema:
            type: integer
            minimum: 1
        - name: id__in
          in: query
          description: Return events by comma-separated numeric IDs.
          schema:
            type: string
        - name: search
          in: query
          description: Search event names.
          schema:
            type: string
      responses:
        '200':
          description: Paginated organization event page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationEvents'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/venue/{venueId}/events/{slugOrId}/:
    get:
      tags:
        - Private organization API
      operationId: getOrganizationEvent
      summary: Get one organization event
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/SlugOrId'
      responses:
        '200':
          description: Organization event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationEvent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venue/{venueId}/financials/invoices/:
    get:
      tags:
        - Private organization API
      operationId: listOrganizationInvoices
      summary: List organization orders
      description: >-
        Lists organization-scoped orders. This endpoint can be used to find all organization orders for a
        patron by email without authenticating the patron with Showpass. Historical, refunded, voided, and
        transferred records are returned when they remain visible to the organization. The response contains
        invoice-level fields only; it does not embed `invoice_items` or `ticket_items`. Use the invoice-items
        endpoint and the invoice tickets endpoint when those records are required.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/VenuePage'
        - $ref: '#/components/parameters/VenuePageSize'
        - name: email
          in: query
          description: Patron email associated with the order. URL-encode the value.
          schema:
            type: string
            format: email
          example: patron%40example.com
        - name: user_id
          in: query
          description: Showpass user ID associated with the order.
          schema:
            type: integer
            minimum: 1
        - name: invoice_items__event_for_filtering
          in: query
          description: Restrict results to orders containing this Showpass event ID.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated organization invoice page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationInvoices'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/venue/{venueId}/financials/invoices/items/:
    get:
      tags:
        - Private organization API
      operationId: listOrganizationInvoiceItems
      summary: List invoice line items
      description: >-
        Lists the accounting line items for organization invoices. Pass the numeric invoice `id` returned by
        the organization invoice endpoint in the `invoice` query parameter. These are invoice lines, not
        individual ticket records.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/VenuePage'
        - $ref: '#/components/parameters/VenuePageSize'
        - name: invoice
          in: query
          description: Numeric invoice ID from the organization invoice response.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated invoice line items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationInvoiceItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/venue/{venueId}/financials/invoices/{transactionId}/:
    get:
      tags:
        - Private organization API
      operationId: getOrganizationInvoice
      summary: Get one organization order
      description: >-
        Returns the same invoice-level shape as the organization invoice list. `invoice_items` and
        `ticket_items` are not embedded in this response.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Organization order detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venue/{venueId}/financials/invoices/{transactionId}/tickets/:
    get:
      tags:
        - Private organization API
      operationId: listOrganizationInvoiceTickets
      summary: List ticket barcodes for an organization order
      description: >-
        Returns the ticket barcode data for an organization order. The `barcode_string` value is the ticket
        barcode/QR payload used for scanning; it is not the ticket database ID. The response is ready only
        after post-purchase ticket generation has completed.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: transactionId
          in: path
          required: true
          description: Showpass invoice transaction ID.
          schema:
            type: string
      responses:
        '200':
          description: Ticket barcode data is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvoiceTickets'
        '202':
          description: Ticket generation is not complete yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationInvoiceTickets'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venue/{venueId}/tickets/items/:
    get:
      tags:
        - Private organization API
      operationId: listOrganizationTicketItems
      summary: List organization ticket items
      description: >-
        Lists the detailed ticket records for the organization. Use the numeric `invoice` query parameter to
        retrieve holder, assigned-seat, status, transfer, and barcode fields for one order. This endpoint is
        read-only. A transferred original ticket remains visible with its transferred status; the recipient's
        replacement ticket is a separate ticket record.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/VenuePage'
        - $ref: '#/components/parameters/VenuePageSize'
        - name: invoice
          in: query
          description: Numeric invoice ID from the organization invoice response.
          schema:
            type: integer
            minimum: 1
        - name: event
          in: query
          description: Showpass event ID.
          schema:
            type: integer
            minimum: 1
        - name: type
          in: query
          description: Showpass ticket type ID.
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          description: Numeric ticket status. Paid tickets use status `2`; transferred tickets use status `7`.
          schema:
            type: integer
        - name: barcode_string
          in: query
          description: Ticket barcode or scan-code value.
          schema:
            type: string
      responses:
        '200':
          description: Paginated detailed ticket items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationTicketItems'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/venue/{venueId}/tickets/items/{ticketId}/:
    get:
      tags:
        - Private organization API
      operationId: getOrganizationTicketItem
      summary: Get one organization ticket item
      description: >-
        Returns one detailed ticket record, including `name_on_ticket`, `seat`, `status`,
        `transfer_in_progress`, and `barcode_string`. The `seat` object is null for general-admission tickets.
        When present, `segment_identifier` is the section, `location_identifier` is the row, and `identifier`
        is the seat number.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: ticketId
          in: path
          required: true
          description: Numeric Showpass ticket-item ID.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Detailed organization ticket item
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTicketItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venue/{venueId}/tickets/transfers/:
    get:
      tags:
        - Private organization API
      operationId: listOrganizationTicketTransfers
      summary: List organization ticket transfers
      description: >-
        Lists read-only ticket-transfer history for the organization. Use the `state` filter to inspect
        pending, cancelled, completed, or returned transfers. A completed transfer has a separate recipient
        invoice and replacement ticket records.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/VenuePage'
        - $ref: '#/components/parameters/VenuePageSize'
        - name: state
          in: query
          description: Transfer state.
          schema:
            type: string
            enum:
              - pending
              - cancelled
              - complete
              - returned
      responses:
        '200':
          description: Paginated organization ticket transfers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationTicketTransfers'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/venue/{venueId}/tickets/transfers/{transferId}/:
    get:
      tags:
        - Private organization API
      operationId: getOrganizationTicketTransfer
      summary: Get one organization ticket transfer
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: transferId
          in: path
          required: true
          description: Numeric Showpass ticket-transfer ID.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Organization ticket transfer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationTicketTransfer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/venue/{venueId}/tickets/transfers/search-histories/:
    get:
      tags:
        - Private organization API
      operationId: searchOrganizationTicketTransferHistories
      summary: Search organization ticket-transfer histories
      description: >-
        Searches transfer history by sender or recipient email, or by customer-group ID. This endpoint is
        read-only and returns compact item summaries in addition to the transfer metadata.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/VenuePage'
        - $ref: '#/components/parameters/VenuePageSize'
        - name: email
          in: query
          description: Sender or recipient email. URL-encode the value.
          schema:
            type: string
            format: email
        - name: customer_group_id
          in: query
          description: Showpass customer-group ID.
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Paginated transfer-history search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOrganizationTicketTransferHistories'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/user/financials/invoices/v2/:
    get:
      tags:
        - Historical account
      operationId: listPatronOrders
      summary: List orders for the authenticated patron
      description: >-
        This is an account-scoped list and does not accept an event_id filter. Follow the next link for every
        page, then retrieve each transaction detail and filter its ticket_items.event or
        invoice_items.event.id.
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: is_group_sale__isnull
          in: query
          description: Use true to omit group-sale invoices from the list.
          schema:
            type: boolean
        - name: type__in
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated patron orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInvoices'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/financials/invoices/{transactionId}/transaction/:
    get:
      tags:
        - Historical account
      operationId: getPatronOrder
      summary: Get one patron order by transaction ID
      security:
        - JwtAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order detail with event and ticket information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/user/tickets/items/:
    get:
      tags:
        - Historical account
      operationId: listPatronTickets
      summary: List tickets owned by the authenticated patron
      security:
        - JwtAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: invoice
          in: query
          description: Numeric invoice ID.
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Paginated ticket items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTickets'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/user/tickets/events/{eventId}/:
    get:
      tags:
        - Historical account
      operationId: getPatronEventSummary
      summary: Get an event summary for the authenticated patron
      description: Returns the event and the patron's ticket count for it; use order detail reads to identify orders.
      security:
        - JwtAuth: []
      parameters:
