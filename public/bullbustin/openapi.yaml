          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Basket not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Held baskets and hold links
      operationId: updateHeldBasket
      summary: Edit a held basket
      description: >-
        Read the basket first, then send its complete desired item_groups list with existing group IDs and the
        customer, seller, and allocation settings you need to retain. Omitted groups are removed. Inventory,
        sale windows, event requirements, and hold restrictions are validated again. The example covers
        general admission tickets. Requires
        box office and manage-holds permissions. Seller visibility restrictions still apply. This route
        serializes edits but does not enforce the regular basket version-key check.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/HoldBasketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldBasketEditRequest'
            examples:
              tickets:
                summary: Update a two-ticket general admission basket; replace IDs and version key with GET values
                value:
                  item_groups:
                    - id: 41001
                      item_type: ticket
                      type: 3002
                      quantity: 2
                  email: customer@example.com
                  name_on_ticket: Example Customer
                  sold_by: 2001
                  payment_type: 2
      responses:
        '200':
          description: Updated held basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldBasket'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested basket or hold details not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/baskets/holds/{basketId}/release/:
    post:
      tags:
        - Held baskets and hold links
      operationId: releaseHeldBasket
      summary: Release a held basket
      description: >-
        Queues release of the held inventory. No request body is required. The 201 response acknowledges
        queued work, not completed release. Stop sharing the hold link when requesting release, and confirm
        release in the organizer dashboard before treating the inventory as available again.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/HoldBasketId'
      responses:
        '201':
          description: Release queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldBackgroundJob'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Basket not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/baskets/holds/{basketId}/send-hold-link-email/:
    post:
      tags:
        - Held baskets and hold links
      operationId: sendHeldBasketLinkEmail
      summary: Email the hold link to the customer
      description: >-
        Optional delivery action. Requires an email address already saved on the basket and an available hold
        link. Recipient is taken from the basket, not a request email field. An empty JSON object uses
        existing settings. The response queues delivery; it does not confirm that the email has reached the
        customer.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/HoldBasketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldLinkEmailRequest'
            examples:
              existingSettings:
                value: {}
              message:
                value:
                  message_to_customer: Your Bullbustin tickets are reserved. Complete checkout using the link.
                  language: en
      responses:
        '201':
          description: Email delivery queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldBackgroundJob'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Basket not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Hold link email rate limit exceeded; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/baskets/holds/{basketId}/split/:
    post:
      tags:
        - Held baskets and hold links
      operationId: splitHeldBasket
      summary: Split a held basket
      description: >-
        Move selected quantities into a new held basket. Send unique existing item_group_id values and
        positive quantities. The original retains the remainder and is released if emptied. Baskets with
        assigned seating cannot be split. Provide email with name_on_ticket to assign a new customer;
        otherwise the original customer details are copied. The response contains only the new basket ID.
        Retrieve that basket and check its hold status and returned link before sharing it. This action does
        not send a hold link email.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/HoldBasketId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldSplitRequest'
            examples:
              newCustomer:
                value:
                  ticket_item_groups_to_split:
                    - item_group_id: 41001
                      quantity: 1
                  name_on_ticket: Another Customer
                  email: another.customer@example.com
      responses:
        '200':
          description: New held basket created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldSplitResult'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested basket or hold details not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/baskets/holds/bulk-send-hold-link-email/:
    post:
      tags:
        - Held baskets and hold links
      operationId: bulkSendHeldBasketLinkEmails
      summary: Email hold links for multiple baskets
      description: >-
        Each basket must belong to this venue and already have a customer email and hold link. Recipient
        addresses come from the baskets. Optional message_to_customer and language are saved for each basket.
        Validation and email rate limits apply per basket. The 201 response queues a bulk job, which then
        queues individual email tasks. This response does not confirm that the emails were sent or delivered.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldBulkEmailRequest'
            examples:
              existingSettings:
                value:
                  basket_ids:
                    - 12001
                    - 12002
              message:
                value:
                  basket_ids:
                    - 12001
                    - 12002
                  message_to_customer: Your Bullbustin tickets are reserved. Complete checkout using your hold link.
                  language: en
      responses:
        '201':
          description: Bulk email job queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldBackgroundJob'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested basket or hold details not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: A basket has reached its hold link email rate limit; retry later.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/baskets/holds/dynamic/:
    get:
      tags:
        - Held baskets and hold links
      operationId: listDynamicHoldSettings
      summary: List dynamic hold settings
      description: >-
        Use the hold metadata ID from basket.on_hold_detail.id, not basket.id. This endpoint manages existing
        hold details. Create a dynamic hold through the basket hold action with hold_type=dynamic_hold, then
        retrieve the basket for its metadata ID and checkout link. Use the held-basket release action to
        release inventory. Venue access and permissions apply. Returns venue-scoped hold metadata, which can
        also include other hold types; the route does not filter by hold_type. Default page size is 20.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/Page'
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: Paginated hold settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDynamicHoldSettings'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested basket or hold details not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/baskets/holds/dynamic/{holdDetailsId}/:
    get:
      tags:
        - Held baskets and hold links
      operationId: getDynamicHoldSettings
      summary: Retrieve dynamic hold settings
      description: >-
        Use the hold metadata ID from basket.on_hold_detail.id, not basket.id. This endpoint manages existing
        hold details. Create a dynamic hold through the basket hold action with hold_type=dynamic_hold, then
        retrieve the basket for its metadata ID and checkout link. Use the held-basket release action to
        release inventory. Venue access and permissions apply.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/HoldDetailsId'
      responses:
        '200':
          description: Hold details and linked basket expiry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicHoldSettings'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested basket or hold details not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Held baskets and hold links
      operationId: updateDynamicHoldSettings
      summary: Update dynamic hold settings
      description: >-
        Use the hold metadata ID from basket.on_hold_detail.id, not basket.id. This endpoint manages existing
        hold details. Create a dynamic hold through the basket hold action with hold_type=dynamic_hold, then
        retrieve the basket for its metadata ID and checkout link. Use the held-basket release action to
        release inventory. Venue access and permissions apply. Edit description, purchase limits, banner, or
        expiry. Send both purchase limits together to validate their relationship. Omitted expiry stays
        unchanged; null removes it. is_comp_hold_link and items_sold are read-only. Use application/json for
        text and numeric settings, or multipart/form-data to upload image_banner. Refresh settings after
        saving.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - $ref: '#/components/parameters/HoldDetailsId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DynamicHoldSettingsUpdate'
            examples:
              limits:
                value:
                  description: Bullbustin group allocation
                  purchase_limit_min: 1
                  purchase_limit_max: 4
              expiry:
                summary: Requires expiry enablement; replace with a future timestamp
                value:
                  hold_expiry_date: '2027-01-01T00:00:00Z'
              clearExpiry:
                value:
                  hold_expiry_date: null
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DynamicHoldSettingsUpload'
      responses:
        '200':
          description: Updated hold settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DynamicHoldSettings'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Requested basket or hold details not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    JwtAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Send `JWT <access-token>`.
    OrganizationToken:
      type: apiKey
      in: header
      name: Authorization
      description: Send `Token <organization-api-key>`. This key is scoped to one organization.
  parameters:
    VenueId:
      name: venueId
      in: path
      required: true
      description: Numeric Showpass organization/venue ID.
      schema:
        type: integer
        minimum: 1
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    VenuePage:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    VenuePageSize:
      name: page_size
      in: query
      description: Organization API page size. The invoice and event list defaults to 10.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 10
    SlugOrId:
      name: slugOrId
      in: path
      required: true
      schema:
        type: string
    InvoiceId:
      name: invoiceId
      in: path
      required: true
      schema:
        type: integer
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: Resource ID returned by this API.
    HoldBasketId:
      name: basketId
      in: path
      required: true
      description: Numeric basket id returned by basket creation, not a transaction ID or link slug.
      schema:
        type: integer
        minimum: 1
    HoldDetailsId:
      name: holdDetailsId
      in: path
      required: true
      description: >-
        Hold metadata ID from basket.on_hold_detail.id or the dynamic settings list. This is not the basket
        ID.
      schema:
        type: integer
        minimum: 1
  responses:
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The organization token is not permitted for this organization or operation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found or outside the caller's permitted scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      additionalProperties: true
      properties:
        detail:
          type: string
        field:
          type: string
          nullable: true
        error_list:
          type: array
          items:
            type: string
        error_code:
          type: object
          additionalProperties: true
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: true
        otp_token:
          type: string
          nullable: true
        captcha_token:
          type: string
          nullable: true
    RegistrationRequest:
      type: object
      required:
        - email
        - first_name
        - last_name
        - password1
        - password2
        - remember
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        password1:
          type: string
          format: password
        password2:
          type: string
          format: password
        remember:
          type: boolean
          default: true
        captcha_token:
          type: string
          nullable: true
    LoginResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
        jwt_token:
          type: string
        refresh:
          type: string
          nullable: true
    RefreshRequest:
      type: object
      required:
        - refresh
      properties:
        refresh:
          type: string
    JwtResponse:
      type: object
      properties:
        access:
          type: string
        refresh:
          type: string
          nullable: true
    User:
      type: object
      properties:
        pk:
          type: integer
        username:
          type: string
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    Event:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        slug:
          type: string
        name:
          type: string
        starts_on:
          type: string
          format: date-time
        ends_on:
          type: string
          format: date-time
        timezone:
          type: string
        ticket_types:
          type: array
          items:
            type: object
            additionalProperties: true
    PatronEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            user_ticket_count:
              type: integer
              nullable: true
    PaginatedEvents:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/Event'
    OrganizationEvent:
      allOf:
        - $ref: '#/components/schemas/Event'
        - type: object
          properties:
            venue:
              $ref: '#/components/schemas/Organization'
    PaginatedOrganizationEvents:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        next_page_number:
          type: integer
          nullable: true
        previous_page_number:
          type: integer
          nullable: true
        page_number:
          type: integer
        num_pages:
          type: integer
        next_list:
          type: array
          items:
            type: integer
        previous_list:
          type: array
          items:
            type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationEvent'
    Organization:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    InvoiceSummary:
      type: object
      additionalProperties: true
      properties:
        transaction_id:
          type: string
        created:
          type: string
          format: date-time
        type:
          type: integer
        final_amount:
          type: string
        amount_refunded:
          type: string
        is_refunded:
          type: boolean
        ticket_items:
          type: array
          items:
            type: object
            additionalProperties: true
        invoice_items:
          type: array
          items:
            type: object
            additionalProperties: true
    PaginatedInvoices:
      type: object
      properties:
        count:
          type: integer
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/InvoiceSummary'
    OrganizationInvoice:
      type: object
      additionalProperties: true
      description: >-
        Flat invoice-level organization response. Related invoice lines and ticket barcode data are returned
        by separate endpoints.
      properties:
        id:
          type: integer
        transaction_id:
          type: string
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        final_amount:
          type: string
        amount_paid:
          type: string
        amount_refunded:
          type: string
        is_refunded:
          type: boolean
        email:
          type: string
          format: email
        phone_number:
          type: string
          nullable: true
        name_on_ticket:
          type: string
          nullable: true
        payment_type:
          type: string
        type:
          type: integer
        venue_id:
          type: integer
        venue:
          $ref: '#/components/schemas/Organization'
        user:
          $ref: '#/components/schemas/User'
        receipt_url:
          type: string
          format: uri
          nullable: true
    PaginatedOrganizationInvoices:
      type: object
      properties:
        next:
          type: string
          nullable: true
        previous:
          type: string
          nullable: true
        next_page_number:
          type: integer
          nullable: true
        previous_page_number:
          type: integer
          nullable: true
        page_number:
          type: integer
        next_list:
          type: array
          items:
            type: integer
        previous_list:
          type: array
          items:
            type: integer
        results:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationInvoice'
    InvoiceItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        invoice:
          type: integer
        description:
          type: string
        quantity:
          type: integer
        price:
          type: string
        event:
          $ref: '#/components/schemas/Event'
    OrganizationInvoiceItem:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        description:
          type: string
        quantity:
          type: integer
        transfer_quantity:
          type: integer
        price:
          type: string
        amount_earned:
          type: string
        tax:
          type: string
        final_amount:
          type: string
        amount_refunded:
          type: string
        amount_paid:
          type: string
        type:
          type: string
        event:
          $ref: '#/components/schemas/Event'
          nullable: true
        membership_group:
          type: object
          nullable: true
          additionalProperties: true
    PaginatedOrganizationInvoiceItems:
      type: object
      properties:
        count:
          type: integer
