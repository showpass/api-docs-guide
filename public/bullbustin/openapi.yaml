        created:
          type: string
          format: date-time
          nullable: true
        updated:
          type: string
          format: date-time
          nullable: true
        items_sold:
          type: integer
          description: Read-only count.
          readOnly: true
    DynamicHoldSettingsUpload:
      type: object
      properties:
        description:
          type: string
          description: Customer-facing hold description.
          nullable: true
          maxLength: 1000
        purchase_limit_min:
          type: integer
          description: Minimum per purchase. Null clears the configured minimum. A value of 0 is normalized to 1.
          nullable: true
          minimum: 0
        purchase_limit_max:
          type: integer
          description: >-
            Maximum per purchase. Keep it at least as large as the minimum; send both limits together when
            changing them.
          minimum: 0
        hold_expiry_date:
          type: string
          description: >-
            Optional future expiry for the linked basket, or null to remove it. Omit to leave expiry
