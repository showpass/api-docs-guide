  /api/venue/{venueId}/tickets/baskets/:
    post:
      tags:
        - Held baskets and hold links
      operationId: createBasketForHold
      summary: Create a basket for a hold
      description: >-
        ### Create and share a hold link


        1. Create a basket with the desired ticket type IDs and quantities. Save the returned numeric `id`.

        2. POST to `/api/venue/{venueId}/tickets/baskets/{basketId}/hold/` with `{"hold_type":"basic_hold"}`.

        3. A `200` response with `{}` means synchronous completion. A `201` response with `job_id`
        acknowledges queued work, not a completed hold. Retrieve the basket with bounded retries and backoff
        until its hold status and link are ready. If it does not become ready, stop and check the hold in the
        organizer dashboard.


        4. Retrieve the basket. Confirm `status: 10` and read `on_hold_detail.tracking_link_url`, falling back
        to `hold_url`. If neither is present, the link is not ready; do not construct a URL from the basket
        ID. A hold response does not itself contain the link.

        5. Open or share the returned URL for the customer to complete hosted checkout. Creating a hold does
        not charge the customer or issue purchased tickets. Optionally use the separate hold link email
        action.

        6. Release the hold with the release endpoint. Release returns a background job.
        Confirm release in the organizer dashboard before
        treating the inventory as available again.


        Use the same authenticated server-side client through the workflow. Basket access is limited to the
        active session or baskets sold by the caller. Held basket access also applies hold-management and
        seller visibility rules. Box office permission is required for basket creation; hold management is
        required for hold actions. A token must be authorized for the venue and operation.


        The example below is a general admission ticket hold. Replace the example IDs with the desired venue
        and ticket type. Event-required customer fields, inventory limits, and allocation rules still apply.
        Hold expiry and complimentary hold links depend on venue/environment enablement; their availability
        has not been verified for Bullbustin.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldBasketCreateRequest'
            examples:
              tickets:
                summary: Reserve two general admission tickets for a customer
                value:
                  item_groups:
                    - item_type: ticket
                      type: 3002
                      quantity: 2
                  info_first_name: Example
                  info_last_name: Customer
                  info_email: customer@example.com
                  email: customer@example.com
      responses:
        '201':
          description: Basket created. Use its id in the hold action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HoldBasket'
        '400':
          description: Invalid input, basket state, inventory, or configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Insufficient venue scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Basket not found or unavailable to the caller.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
