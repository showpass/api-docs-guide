      operationId: verifyTicketByCode
      summary: Verify a ticket by code
      description: >-
        Look up a ticket and its current state. Use the returned ticket item ID for scan history actions. This
        lookup does not perform entry pickup.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
        - name: code
          in: query
          required: true
          description: Barcode or code to verify.
          schema:
            type: string
        - name: permittedTypeIDs
          in: query
          required: false
          description: Comma-separated permitted ticket type IDs; omit instead of sending an empty string.
          schema:
            type: string
        - name: scannerTypeID
          in: query
          required: false
          description: Registered scanner device type ID.
          schema:
            type: integer
      responses:
        '200':
          description: Verify a ticket by code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedTicket'
        '400':
          description: Invalid request fields or operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid credentials or insufficient scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ticket not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Ticket scanning
      operationId: verifyTicketByCodePost
      summary: Verify a ticket with a request body
      description: >-
        Same verification as GET; accepts the code and permitted type IDs in JSON. Useful for a large
        permitted type list.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanTicketRequest'
            examples:
              code:
                value:
                  code: EXAMPLE-BARCODE
                  permittedTypeIDs: 3002,3003
      responses:
        '200':
          description: Verify a ticket with a request body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifiedTicket'
        '400':
          description: Invalid request fields or operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid credentials or insufficient scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Ticket not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/venue/{venueId}/tickets/items/histories/:
    post:
      tags:
        - Ticket scanning
      operationId: createTicketScanHistory
      summary: Scan, undo a scan, or void a ticket
      description: >-
        First verify the ticket to obtain item and barcode_string. pickup marks it used subject to its
        multiscan limit; return undoes a previous scan; void invalidates an unused ticket. A scan return does
        not issue a financial refund. Invalid state transitions return a validation error.
      security:
        - OrganizationToken: []
      parameters:
        - $ref: '#/components/parameters/VenueId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScanHistoryRequest'
            examples:
              pickup:
                summary: Scan for entry
                value:
                  item: 123
                  action: pickup
                  scanner_device: web_app
                  barcode_string: EXAMPLE-BARCODE
                  barcode_type: static
              return:
                summary: Undo a scan
                value:
                  item: 123
                  action: return
              void:
                summary: Invalidate an unused ticket
                value:
                  item: 123
                  action: void
      responses:
        '201':
          description: Scan, undo a scan, or void a ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanHistory'
        '400':
          description: Invalid request fields or operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Invalid credentials or insufficient scope or permissions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
